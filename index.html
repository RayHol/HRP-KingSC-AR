    <div class="logo-container">
        <img id="hrp-logo" src=".\Assets\HRP Logo.png" alt="Historic Royal Palaces Logo">

    <!-- Main Content -->
    <div class="main-content">
        <h1 class="main-title">THE KING'S STAIRCASE</h1>

<script>
async function startExperience() {
    // Get location parameter from URL
    const urlParams = new URLSearchParams(window.location.search);
    const location = urlParams.get('location');
    
    // Default to 'stairs' if no location parameter is provided
    const selectedLocation = location || 'stairs';
    
    // Validate location parameter
    if (selectedLocation !== 'stairs' && selectedLocation !== 'balcony') {
        console.warn('Invalid location parameter, defaulting to stairs');
        window.location.href = 'hotspots_page.html?location=stairs';
        return;
    }
    
    console.log(`Starting experience for location: ${selectedLocation}`);
    
    try {
        // Request device motion permissions before navigating
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
            console.log('Requesting device motion permission...');
            const permission = await DeviceMotionEvent.requestPermission();
            
            if (permission === 'granted') {
                console.log('Device motion permission granted');
            } else {
                console.warn('Device motion permission denied, but continuing...');
            }
        } else {
            console.log('Device motion permission not required on this device');
        }
        
        // Request device orientation permissions if available
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            console.log('Requesting device orientation permission...');
            const permission = await DeviceOrientationEvent.requestPermission();
            
            if (permission === 'granted') {
                console.log('Device orientation permission granted');
            } else {
                console.warn('Device orientation permission denied, but continuing...');
            }
        } else {
            console.log('Device orientation permission not required on this device');
        }
        
    } catch (error) {
        console.warn('Error requesting permissions:', error);
        // Continue anyway - some devices don't require explicit permission
    }
    
    // Navigate to hotspots page after permission request
    window.location.href = `hotspots_page.html?location=${selectedLocation}`;
}

// Optional: Update page content based on location
document.addEventListener('DOMContentLoaded', function() {
    const urlParams = new URLSearchParams(window.location.search);
    const location = urlParams.get('location');
    
    if (location === 'balcony') {
        // You could update the title or subtitle here if needed
        console.log('Balcony location detected');
    } else if (location === 'stairs') {
        console.log('Stairs location detected');
    } else {
        console.log('No location parameter detected, defaulting to stairs');
    }
});
</script>
