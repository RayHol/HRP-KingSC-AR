<!DOCTYPE html>
<!DOCTYPE html>
<html>

<head>
    <!-- Set the viewport and initial scale for mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Enable full-screen mode on Apple devices -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <!-- Set the character encoding -->
    <meta charset="UTF-8" />

    <!-- Include the A-Frame library for WebVR development -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    
    <!-- Include the MIND AR library for augmented reality features -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.1/dist/mindar-image-aframe.prod.js"></script>
    
    <!-- Include the custom JavaScript file for AR functionality -->
    <script src=".\Scripts\ar_page.js"></script>
  
  <!-- Set the title of the webpage -->
    <title>Smartify - HRP | The Kings Staircases</title>
   <!-- Include the Poppins font from Google Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap">
    
    <!-- Include the custom CSS file for styling -->
    <link rel="stylesheet" href=".\Scripts\ar_page.css">
    
  
</head>

<body>
    <div id="new-scanning-overlay" class="hidden">
        <div id="icon-wrapper">
          <img src="./Assets/Scanning-icon.svg" alt="Scanning Icon">
          <div id="moving-line"></div>
          <div id="background-in-icon-wrapper"></div>
        </div>
    </div>

    <!-- Background container -->
<!--     <div id="background"></div> -->
    
    <!-- Text to prompt the user to point the camera at the painting -->
    <div id="startText">Point your camera at the painting</div>
    
    <!-- Audio prompt container -->
    <div id="audioPrompt">
        <button id="audioButton">
            <img id="audioPromptIcon" src="./Assets/mute-icon.svg" alt="Audio Icon">
            Enable Audio
        </button>
    </div>
    
    <!-- New back button -->
    <button id="backButton"></button>

    <!-- A-Frame scene container -->
    <a-scene
        loading-screen="enabled: false"
        mindar-image="imageTargetSrc: .\Assets\targets.mind; uiLoading:no; uiScanning: #new-scanning-overlay; warmupTolerance: 10; missTolerance: 1; filterMinCF: 0.0001; filterBeta: 0.001"
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        
    >
        <!-- Asset container -->
        <a-assets>
            <!-- Video 1 asset for target 1 -->
            <video id="video1" src=".\Assets\Videos\cw_guitar.mp4" preload="auto" response-type="arraybuffer" loop
                crossorigin="anonymous" webkit-playsinline autoplay muted playsinline>
            </video>
            <!-- Video 2 asset for target 2 -->
            <video id="video2" src=".\Assets\Videos\ceiling1.mp4" preload="auto" response-type="arraybuffer" loop
                crossorigin="anonymous" webkit-playsinline autoplay muted playsinline>
            </video>
            <!-- Video 3 asset for target 3 -->
            <video id="video3" src=".\Assets\Videos\cw_all.mp4" preload="auto" response-type="arraybuffer" loop
                crossorigin="anonymous" webkit-playsinline autoplay muted playsinline>
            </video>
       </a-assets>

        <!-- Camera entity -->
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        
        <!-- Ambient light entity -->
        <a-light type="ambient" color="#FFF"></a-light>
        
        <!-- AR target 1 entity -->
        <a-entity id="target1" mindar-image-target="targetIndex: 0" ar-controller
            smooth-position="target: #videooverlay1; factor: 0.1">
            <a-plane id="videooverlay1" 
                material="src: #video1; opacity: 0; transparent: false; alphaTest: 0.5"
                animation__fadein="startEvents: fadein1; property: material.opacity; from: 0; to: 1; dur: 500;" height="1.2" width="2"
                animation__fadeout="startEvents: fadeout1; property: material.opacity; from: 1; to: 0; dur: 500;"></a-plane>
        </a-entity>

        <!-- AR target 2 entity -->
        <a-entity id="target2" mindar-image-target="targetIndex: 1" ar-controller
            smooth-position="target: #videooverlay2; factor: 0.1">
            <a-plane id="videooverlay2" 
                material="src: #video2; opacity: 0; transparent: false; alphaTest: 0.5"
                animation__fadein="startEvents: fadein2; property: material.opacity; from: 0; to: 1; dur: 500;" height="1.5" width="2"
                animation__fadeout="startEvents: fadeout2; property: material.opacity; from: 1; to: 0; dur: 500;"></a-plane>
        </a-entity>

        <!-- AR target 3 entity -->
        <a-entity id="target3" mindar-image-target="targetIndex: 2" ar-controller
            smooth-position="target: #videooverlay3; factor: 0.1">
            <a-plane id="videooverlay3" 
                material="src: #video3; opacity: 0; transparent: false; alphaTest: 0.5"
                animation__fadein="startEvents: fadein3; property: material.opacity; from: 0; to: 1; dur: 500;" height="1.2" width="2
                animation__fadeout="startEvents: fadeout3; property: material.opacity; from: 1; to: 0; dur: 500;"></a-plane>
        </a-entity>
      </a-scene>
  <!-- <div id="textPanel" class="text-panel">
    <p id="textPanelContent">                                                 </p>
</div> -->

</body>

</html>
