    <!-- Modal for Hotspot Info -->
    <div id="hotspot-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span id="close-hotspot-modal" class="close">&times;</span>
            <h3 id="hotspot-title">Hotspot Title</h3>
            <p id="hotspot-description">Hotspot description will appear here.</p>
            <div id="hotspot-media"></div>
            <a id="hotspot-link" href="#" target="_blank" class="hotspot-link">Learn More</a>
        </div>
    </div>

    <!-- A-Frame Scene -->
    <!-- <div class="centered instructions"></div> -->
    
    <a-scene id="ar-scene" vr-mode-ui="enabled: false" arjs="debugUIEnabled: enabled;" style="display:block;">
        <a-light type="ambient" color="#ffffff" ></a-light>
        <a-light type="directional" color="#ffffff" position="-2 4 5"></a-light>
        <a-entity camera rotation-reader look-controls="touchEnabled: false" raycaster="objects: .clickable" position="0 1.6 0"></a-entity>
    </a-scene>

    <script>
    document.addEventListener("DOMContentLoaded", function() {
        const arScene = document.getElementById('ar-scene');
        
        // Automatically display the AR scene
        arScene.style.display = 'block';
        
        // Initialize hotspots immediately
        if (typeof initializeHotspots === "function") {
            initializeHotspots();
        }
    });
